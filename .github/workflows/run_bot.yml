name: Lancer le script du bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "morning ou evening"
        default: "morning"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python bot.py ${{ inputs.mode }}

      - name: Sauvegarder les pronostics du jour
        if: ${{ inputs.mode == 'morning' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add predictions.json
          git diff --cached --quiet || (git commit -m "Pronostics du jour" && git push)